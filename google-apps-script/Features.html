<script>
(() => {
  'use strict';
  const ui = window.ArkhamUI;
  if (!ui) return;
  const { state, node, append, action, field } = ui;
  const L = (en, th) => state.language === 'th' ? th : en;
  const views = ['investigators', 'sessions', 'story', 'rulebook', 'assistant', 'materials', 'tools'];
  const labels = { investigators: 'investigators', sessions: 'sessions', story: 'campaignJournal', rulebook: 'rulebook', assistant: 'assistant', materials: 'materials', tools: 'tools' };
  const icons = { investigators: '♧', sessions: '◷', story: '▤', rulebook: '◇', assistant: '✦', materials: '⌖', tools: '⇅' };
  const active = () => state.data && state.data.activeCampaign;
  const campaignId = () => active().campaign.id;
  const gm = () => active() && ['GM', 'CO_GM'].includes(active().role);
  const canEdit = character => gm() || character.ownerUserId === state.data.user.id;
  const catalog = () => active().catalog || { skills: [], personalities: [], archetypes: [], knacks: [], equipment: [] };
  const catalogList = key => Array.isArray(catalog()[key]) ? catalog()[key] : [];
  const entityName = entity => entity ? state.language === 'th' && entity.thaiName ? entity.thaiName : entity.name || entity.title || entity.id : '—';
  const findEntity = (key, id) => catalogList(key).find(entity => entity.id === id);
  const currentSession = () => (active().sessions || []).find(session => session.status === 'ACTIVE');
  const person = id => (active().members || []).find(member => member.userId === id)?.user?.displayName || id;
  const readOnly = () => state.preview;
  const textValue = value => typeof value === 'string' ? value : JSON.stringify(value);
  function button(label, handler, disabled = false, style = 'button button-outline button-small') { return action(label, style, handler, disabled || readOnly()); }
  function input(label, name, value, options = {}) { const container = field(label, name, value, options); const control = container.querySelector('input,select,textarea'); if (options.min != null) control.min = options.min; if (options.max != null) control.max = options.max; if (options.step != null) control.step = options.step; return container; }
  function choices(list, emptyLabel) { return (emptyLabel ? [['', emptyLabel]] : []).concat(list.map(entity => [entity.id, entityName(entity)])); }
  function section(title, body, controls) { const panel = node('section', 'detail-panel'); append(panel, append(node('div', 'detail-panel-title'), node('h2', '', title), controls), body); return panel; }
  function notice(message, error = false) { return node('div', 'notice-panel' + (error ? ' form-error' : ''), message); }
  function empty(title, description) { return append(node('div', 'feature-empty'), node('span', 'edition-symbol', '✦'), node('h2', '', title), node('p', '', description)); }
  function sourceCitation(record) {
    const source = record.citation || record.source || record;
    const printed = source.printedPage == null ? record.printedPage : source.printedPage;
    const pdf = source.pdfPage == null ? (source.pdfPageIndex == null ? record.pdfPageIndex : source.pdfPageIndex) : Number(source.pdfPage) - 1;
    const parts = [source.title || source.bookTitle || record.bookTitle || 'Corebook'];
    if (printed != null) parts.push(L('printed p. ', 'หน้าหนังสือ ') + printed);
    if (pdf != null) parts.push(L('PDF p. ', 'หน้า PDF ') + (Number(pdf) + 1));
    if (source.sourceVersion || record.sourceVersion) parts.push('v' + (source.sourceVersion || record.sourceVersion));
    return node('p', 'source-citation', parts.join(' · '));
  }
  async function request(operation, payload, version, refresh = true) {
    const result = await ui.rpc(operation, { campaignId: campaignId(), ...payload }, version);
    if (refresh) await ui.loadWorkspace(campaignId());
    return result;
  }
  async function safely(handler) { try { await handler(); } catch (error) { ui.showToast(ui.humanError(error), true); } }
  function modal(title, intro, fields, submit, handler, danger = false) {
    if (readOnly()) return;
    const { form, body } = ui.formBody(); if (intro) body.append(node('p', 'dialog-intro', intro));
    fields.forEach(item => body.append(item));
    const submitLabels = { 'Create investigator': 'สร้างนักสืบ', 'Save review': 'บันทึกผลตรวจ', 'Retire': 'ปลดระวาง', 'Roll': 'ทอย', 'Apply action': 'ใช้การกระทำ', 'Apply equipment change': 'บันทึกอุปกรณ์', 'Advance': 'พัฒนา', 'Award XP': 'มอบ XP', 'Apply correction': 'แก้ไขข้อมูล', 'Save session': 'บันทึกเซสชัน', 'Create session': 'สร้างเซสชัน', 'Save attendance': 'บันทึกผู้เข้าร่วม', 'Set scene': 'ตั้งค่าฉาก', 'Save asset': 'บันทึกเนื้อเรื่อง', 'Create asset': 'สร้างเนื้อเรื่อง', 'Set visibility': 'บันทึกสิทธิ์', 'Add entry': 'เพิ่มบันทึก', 'Translate': 'แปล', 'Save private image': 'เก็บภาพส่วนตัว', 'Analyze image': 'วิเคราะห์ภาพ', 'Save reviewed text': 'บันทึกข้อความที่ตรวจแล้ว', 'Record source review': 'บันทึกผลตรวจแหล่งข้อมูล', 'Register source': 'ลงทะเบียน', 'Import batch': 'นำเข้าชุดข้อมูล', 'Export backup': 'ส่งออกสำรองข้อมูล', 'Restore backup': 'กู้คืนสำรองข้อมูล', 'Reverse XP': 'ย้อน XP', START: 'เริ่ม', PAUSE: 'พัก', RESUME: 'เล่นต่อ', END: 'จบเซสชัน' };
    const submitText = state.language === 'th' ? submitLabels[submit] || submit : submit;
    ui.formFooter(form, submitText, handler, danger);
    ui.openDialog(active().campaign.name, title, form);
    return { form, body };
  }
  function feedback(result) { ui.showToast(L('Saved. Campaign data is up to date.', 'บันทึกแล้ว ข้อมูลแคมเปญเป็นปัจจุบัน')); return result; }
  function tabs(context, selected) {
    const nav = node('nav', 'campaign-tabs'); nav.setAttribute('aria-label', L('Campaign sections', 'ส่วนต่าง ๆ ของแคมเปญ'));
    [['detail', L('Overview', 'ภาพรวม')], ...views.map(view => [view, ui.t(labels[view])])].forEach(([view, label]) => {
      const tab = action(label, 'campaign-tab' + (selected === view ? ' active' : ''), () => open(view));
      if (selected === view) tab.setAttribute('aria-current', 'page'); nav.append(tab);
    }); return nav;
  }
  async function open(view) {
    if (active()) { state.view = view; ui.renderWorkspace(); document.querySelector('#app-content').focus(); return; }
    const campaigns = state.data && state.data.campaigns || [];
    const body = node('div', 'campaign-picker');
    body.append(node('p', 'dialog-intro', L('Choose the campaign whose tools you want to open.', 'เลือกแคมเปญที่ต้องการเปิดเครื่องมือ')));
    if (!campaigns.length) body.append(notice(L('Create or join a campaign first.', 'สร้างหรือเข้าร่วมแคมเปญก่อน')));
    campaigns.forEach(campaign => body.append(action(campaign.name + ' →', 'picker-option', () => safely(async () => {
      ui.closeDialog(); state.view = view; await ui.loadWorkspace(campaign.id);
    }))));
    ui.openDialog(ui.t(labels[view] || 'myCampaigns'), L('Choose a campaign.', 'เลือกแคมเปญ'), body, [{ label: ui.t('close'), style: 'button button-outline', handler: ui.closeDialog }]);
  }
  function launchers() {
    const container = node('section', 'feature-launchers');
    views.forEach(view => container.append(action(icons[view] + '  ' + ui.t(labels[view]) + ' →', 'feature-launcher', () => open(view))));
    return container;
  }
  function render(content, view, context) {
    content.append(action('←  ' + context.campaign.name, 'back-button', () => open('detail')));
    const heading = node('div', 'page-heading'); const copy = node('div');
    append(copy, node('div', 'eyebrow', context.campaign.name), node('h1', '', ui.t(labels[view]))); heading.append(copy); content.append(heading);
    content.append(tabs(context, view));
    if (state.preview) content.append(ui.previewNotice());
    document.querySelectorAll('[data-feature-view]').forEach(item => item.classList.toggle('active', item.dataset.featureView === view));
    ({ investigators: renderInvestigators, sessions: renderSessions, story: renderStory, rulebook: renderRules, assistant: renderAssistant, materials: renderMaterials, tools: renderTools })[view](content);
  }

  function renderInvestigators(content) {
    content.append(append(node('div', 'section-heading'), node('h2', '', L('Your investigators', 'นักสืบในแคมเปญ')), button('+ ' + L('Create investigator', 'สร้างนักสืบ'), createInvestigator)));
    const characters = active().characters || [];
    if (!characters.length) { content.append(empty(L('A face for the unknown.', 'ผู้เผชิญกับสิ่งที่ยังไม่รู้'), L('Create a draft, complete the six-step wizard, then submit it for GM approval.', 'สร้างร่าง ทำตัวช่วยสร้าง 6 ขั้น แล้วส่งให้ GM อนุมัติ'))); return; }
    const grid = node('div', 'feature-grid');
    characters.forEach(character => {
      const card = node('article', 'entity-card');
      append(card, node('span', 'entity-status', character.status), node('h2', '', character.name), node('p', 'small-muted', person(character.ownerUserId)), node('p', 'entity-summary', entityName(findEntity('archetypes', character.build?.archetypeId))));
      const controls = node('div', 'entity-actions'); controls.append(action(L('Open sheet →', 'เปิดชีต →'), 'text-button', () => characterSheet(character)));
      if (canEdit(character) && ['DRAFT', 'REJECTED', 'NEEDS_CHANGES'].includes(character.status)) controls.append(button(L('Resume draft', 'เขียนร่างต่อ'), () => investigatorWizard(character)));
      if (gm() && character.status === 'SUBMITTED') controls.append(button(L('Review', 'ตรวจและอนุมัติ'), () => reviewInvestigator(character)));
      append(card, controls); grid.append(card);
    }); content.append(grid);
  }
  function createInvestigator() {
    modal(L('Create an investigator.', 'สร้างนักสืบ'), L('The draft belongs to you and this campaign. Nothing is approved until the GM reviews it.', 'ร่างนี้เป็นของคุณและแคมเปญนี้ ต้องให้ GM ตรวจสอบก่อนอนุมัติ'),
      [input(L('Investigator name', 'ชื่อนักสืบ'), 'name', '', { required: true, maxLength: 120 })], 'Create investigator', async values => {
        const result = await request('createInvestigator', { name: String(values.get('name')).trim() });
        setTimeout(() => investigatorWizard(result.character), 0);
      });
  }
  function defaultBuild(character) {
    const build = JSON.parse(JSON.stringify(character.build || {}));
    build.background = build.background || {}; build.skills = build.skills || {};
    catalogList('skills').forEach(skill => { if (build.skills[skill.id] == null) build.skills[skill.id] = 6; });
    build.equipment = build.equipment || []; build.advancements = build.advancements || []; build.package = build.package || 'gear'; return build;
  }
  function investigatorWizard(original) {
    if (readOnly() || !canEdit(original)) return;
    let character = JSON.parse(JSON.stringify(original)), build = defaultBuild(original), name = original.name;
    let step = !build.personalityId ? 0 : !build.archetypeId ? 1 : !build.startingKnackId ? 3 : 5;
    const names = [L('Background', 'ประวัติ'), L('Personality', 'บุคลิก'), L('Archetype', 'ต้นแบบ'), L('Skills', 'ทักษะ'), L('Starting resources', 'ทรัพยากรเริ่มต้น'), L('Review', 'ตรวจทาน')];
    function draw() {
      const form = node('form', 'wizard-form'); const body = node('div', 'dialog-body');
      const progress = node('ol', 'wizard-progress'); names.forEach((label, index) => progress.append(node('li', index === step ? 'active' : index < step ? 'completed' : '', String(index + 1) + ' ' + label))); body.append(progress);
      body.append(node('p', 'dialog-intro', L('Each next step saves your draft to the server. You can resume it later.', 'เมื่อไปขั้นถัดไประบบจะบันทึกร่างบนเซิร์ฟเวอร์ คุณกลับมาเขียนต่อได้')));
      let collect = () => {};
      if (step === 0) {
        body.append(input(L('Investigator name', 'ชื่อนักสืบ'), 'name', name, { required: true, maxLength: 120 }));
        const backgrounds = [['placeOfOrigin', 'Place of origin', 'บ้านเกิด'], ['localVisitor', 'Local or visitor', 'คนท้องถิ่นหรือผู้มาเยือน'], ['family', 'Family', 'ครอบครัว'], ['friends', 'Friends', 'เพื่อน'], ['employment', 'Employment', 'งาน'], ['lifestyle', 'Lifestyle', 'วิถีชีวิต'], ['firstSupernaturalEncounter', 'First supernatural encounter', 'การพบสิ่งเหนือธรรมชาติครั้งแรก'], ['notableEnemies', 'Notable enemies', 'ศัตรูสำคัญ'], ['narrative', 'Your story', 'เรื่องราวของคุณ']];
        backgrounds.forEach(([key, en, th]) => body.append(input(L(en, th), key, build.background[key], key === 'localVisitor' ? { optional: true, choices: [['', L('Not chosen', 'ยังไม่เลือก')], ['LOCAL', L('Local', 'คนท้องถิ่น')], ['VISITOR', L('Visitor', 'ผู้มาเยือน')]] } : { optional: true, multiline: ['narrative', 'firstSupernaturalEncounter'].includes(key), maxLength: 2000 })));
        collect = values => { name = String(values.get('name')).trim(); backgrounds.forEach(([key]) => { build.background[key] = String(values.get(key) || ''); }); };
      } else if (step === 1) {
        body.append(input(L('Personality trait', 'ลักษณะบุคลิก'), 'personalityId', build.personalityId, { choices: choices(catalogList('personalities'), L('Choose a trait', 'เลือกบุคลิก')), required: true }));
        const details = node('div', 'catalog-detail'); body.append(details);
        const update = () => { const selected = findEntity('personalities', form.elements.personalityId.value); details.replaceChildren(); if (selected) append(details, node('p', '', L('Positive: ', 'ด้านบวก: ') + textValue(selected.positiveEffect || '—')), node('p', '', L('Negative: ', 'ด้านลบ: ') + textValue(selected.negativeEffect || '—')), sourceCitation(selected)); };
        body.querySelector('select').addEventListener('change', update); setTimeout(update, 0);
        collect = values => { build.personalityId = String(values.get('personalityId')); };
      } else if (step === 2) {
        body.append(input(L('Archetype', 'ต้นแบบนักสืบ'), 'archetypeId', build.archetypeId, { choices: choices(catalogList('archetypes'), L('Choose an archetype', 'เลือกต้นแบบ')), required: true }));
        const details = node('div', 'catalog-detail'); body.append(details);
        const update = () => { const selected = findEntity('archetypes', form.elements.archetypeId.value); details.replaceChildren(); if (selected) append(details, node('p', '', selected.description || selected.englishText || ''), node('p', 'field-hint', L('Skill limits: ', 'ข้อกำหนดทักษะ: ') + Object.entries(selected.skillLimits || {}).map(([id, value]) => entityName(findEntity('skills', id)) + ' ' + value + '+').join(', ')), sourceCitation(selected)); };
        body.querySelector('select').addEventListener('change', update); setTimeout(update, 0);
        collect = values => { const chosen = String(values.get('archetypeId')); if (chosen !== build.archetypeId) build.startingKnackId = ''; build.archetypeId = chosen; };
      } else if (step === 3) {
        body.append(notice(L('Assign exactly three skills at 5+ and one different skill at 4+. Remaining skills stay at 6+. The server also checks archetype limits.', 'กำหนด 3 ทักษะเป็น 5+ และอีก 1 ทักษะเป็น 4+ ที่เหลือเป็น 6+ เซิร์ฟเวอร์ตรวจข้อกำหนดต้นแบบอีกครั้ง')));
        const grid = node('div', 'form-row'); catalogList('skills').forEach(skill => grid.append(input(entityName(skill), 'skill-' + skill.id, String(build.skills[skill.id] || 6), { choices: [['6', '6+'], ['5', '5+'], ['4', '4+']] }))); body.append(grid);
        collect = values => { catalogList('skills').forEach(skill => { build.skills[skill.id] = Number(values.get('skill-' + skill.id)); }); };
      } else if (step === 4) {
        const archetype = findEntity('archetypes', build.archetypeId); const knackIds = archetype && archetype.knacks && archetype.knacks[1] || [];
        body.append(input(L('Starting knack', 'Knack เริ่มต้น'), 'startingKnackId', build.startingKnackId, { choices: choices(catalogList('knacks').filter(knack => knackIds.includes(knack.id)), L('Choose a knack', 'เลือก Knack')), required: true }));
        body.append(input(L('Starting package', 'แพ็กเกจเริ่มต้น'), 'package', build.package, { choices: [['gear', L('Additional equipment budget', 'งบอุปกรณ์เพิ่มเติม')], ['xp', L('Starting XP advancements', 'ใช้ XP เริ่มต้นพัฒนา')], ['insight', L('Additional Insight', 'Insight เพิ่มเติม')]] }));
        const equipment = node('div', 'wizard-equipment'); body.append(node('h3', 'form-section-title', L('Starting equipment', 'อุปกรณ์เริ่มต้น')));
        catalogList('equipment').filter(item => item.purchasable !== false).forEach(item => {
          const current = build.equipment.find(record => record.entityId === item.id); const row = input(entityName(item) + (item.priceCents != null ? ' · $' + (item.priceCents / 100).toFixed(2) : ''), 'gear-' + item.id, String(current?.quantity || 0), { type: 'number', min: 0, max: 99, step: 1 }); equipment.append(row);
        }); body.append(equipment);
        body.append(notice(L('Relics and tomes require explicit GM approval. The server validates your equipment budget.', 'Relic และ Tome ต้องให้ GM อนุมัติอย่างชัดเจน เซิร์ฟเวอร์ตรวจงบอุปกรณ์')));
        const upgrades = node('div', 'form-row');
        for (let i = 0; i < 5; i++) {
          const existing = build.advancements[i]; const options = [['', L('No starting advancement', 'ไม่มีการพัฒนา')], ...catalogList('skills').map(item => ['SKILL:' + item.id, L('Skill: ', 'ทักษะ: ') + entityName(item)]), ...catalogList('knacks').map(item => ['KNACK:' + item.id, L('Knack: ', 'Knack: ') + entityName(item)])];
          upgrades.append(input(L('XP package advancement ', 'การพัฒนาแพ็กเกจ XP ') + (i + 1), 'advance-' + i, existing ? existing.kind + ':' + existing.entityId : '', { choices: options }));
        } body.append(upgrades);
        collect = values => {
          build.startingKnackId = String(values.get('startingKnackId')); build.package = String(values.get('package'));
          build.equipment = catalogList('equipment').filter(item => item.purchasable !== false).map(item => ({ entityId: item.id, quantity: Number(values.get('gear-' + item.id)) })).filter(item => item.quantity > 0);
          build.advancements = []; if (build.package === 'xp') for (let i = 0; i < 5; i++) { const value = String(values.get('advance-' + i) || ''); if (value) { const [kind, entityId] = value.split(':'); build.advancements.push({ kind, entityId }); } }
        };
      } else {
        append(body, node('h3', 'form-section-title', name), node('p', 'dialog-intro', entityName(findEntity('personalities', build.personalityId)) + ' · ' + entityName(findEntity('archetypes', build.archetypeId))), node('p', '', L('Package: ', 'แพ็กเกจ: ') + build.package));
        const validation = character.buildValidation;
        if (validation && validation.errors && validation.errors.length) body.append(notice(validation.errors.map(textValue).join('\n'), true));
        else body.append(notice(L('Review your choices. Submission validates the complete build again on the server; GM approval is still required.', 'ตรวจตัวเลือกอีกครั้ง เมื่อส่ง เซิร์ฟเวอร์จะตรวจข้อมูลทั้งหมด และยังต้องรอ GM อนุมัติ')));
        const list = node('ul', 'review-list'); Object.entries(build.skills).forEach(([id, value]) => list.append(node('li', '', entityName(findEntity('skills', id)) + ': ' + value + '+'))); body.append(list);
        build.equipment.forEach(item => body.append(node('p', 'field-hint', entityName(findEntity('equipment', item.entityId)) + ' × ' + item.quantity)));
      }
      const footer = node('div', 'dialog-footer wizard-footer');
      const back = action(L('Previous', 'ก่อนหน้า'), 'button button-outline', () => { if (step > 0) { step--; draw(); } }); back.disabled = step === 0;
      const saveClose = action(L('Save & close', 'บันทึกและปิด'), 'button button-outline', () => save(true));
      const next = node('button', 'button button-gold', step === 5 ? L('Submit for review', 'ส่งให้ GM ตรวจ') : L('Next · save draft', 'ถัดไป · บันทึกร่าง')); next.type = 'submit'; append(footer, back, saveClose, next); append(form, body, footer);
      ui.openDialog(L('INVESTIGATOR · STEP ', 'นักสืบ · ขั้น ') + (step + 1) + '/6', names[step], form);
      async function save(close = false) {
        if (!form.reportValidity() || state.dialogBusy) return;
        collect(new FormData(form)); state.dialogBusy = true; form.querySelectorAll('button').forEach(control => { control.disabled = true; });
        try {
          const result = await request('saveInvestigator', { characterId: character.id, name, build }, character.version, false); character = result.character;
          state.dialogBusy = false;
          if (close) { ui.closeDialog(); await ui.loadWorkspace(campaignId()); }
          else if (step === 5) { await request('submitInvestigator', { characterId: character.id }, character.version); ui.closeDialog(); ui.showToast(L('Submitted for GM review.', 'ส่งให้ GM ตรวจแล้ว')); }
          else { step++; draw(); }
        } catch (error) {
          state.dialogBusy = false; form.querySelectorAll('button').forEach(control => { control.disabled = false; }); back.disabled = step === 0;
          body.querySelector('.form-error')?.remove(); body.append(notice(ui.humanError(error), true));
        }
      }
      form.addEventListener('submit', event => { event.preventDefault(); save(); });
    }
    draw();
  }
  function reviewInvestigator(character) {
    const permissionItems = character.buildValidation?.permissionItems || character.build.equipment.filter(item => /relic|tome/i.test(findEntity('equipment', item.entityId)?.category || '')).map(item => item.entityId);
    const fields = [input(L('Decision', 'ผลตรวจ'), 'decision', 'APPROVE', { choices: [['APPROVE', L('Approve', 'อนุมัติ')], ['REJECT', L('Return for changes', 'ส่งกลับให้แก้ไข')]] }), input(L('Review notes', 'ข้อเสนอแนะ'), 'notes', '', { multiline: true, maxLength: 2000 })];
    const approvals = node('fieldset', 'checkbox-group'); approvals.append(node('legend', '', L('Explicit permission for restricted items', 'อนุมัติอุปกรณ์ที่ต้องขออนุญาตอย่างชัดเจน')));

  function restoreDialog() {
    const fileField = input(L('Campaign backup JSON, at most 3 MB', 'ไฟล์สำรอง JSON แคมเปญ ไม่เกิน 3 MB'), 'backup', '', { type: 'file', required: true }); fileField.querySelector('input').accept = '.json,application/json';
    modal(L('Restore this campaign?', 'กู้คืนแคมเปญนี้?'), L('Recover the records in this backup. Existing access rights, immutable history, and newer records stay in place. The server verifies the backup before changing anything.', 'กู้คืนรายการในสำรองข้อมูลนี้ โดยคงสิทธิ์ปัจจุบัน ประวัติที่แก้ย้อนหลังไม่ได้ และรายการที่สร้างใหม่กว่า เซิร์ฟเวอร์ตรวจไฟล์ก่อนเปลี่ยนข้อมูล'), [fileField, input(L('Type the campaign name to confirm', 'พิมพ์ชื่อแคมเปญเพื่อยืนยัน'), 'confirmation', '', { required: true }), input(L('Reason for restore', 'เหตุผลการกู้คืน'), 'reason', '', { required: true, maxLength: 1000 }), consentCheckbox(L('I have saved a current backup and authorize recovering records in this campaign.', 'ฉันสำรองข้อมูลปัจจุบันแล้วและยืนยันให้กู้คืนรายการในแคมเปญนี้'))], 'Restore backup', async values => {
      if (String(values.get('confirmation')) !== active().campaign.name) throw new Error(L('The campaign name does not match.', 'ชื่อแคมเปญไม่ตรง'));
      const file = values.get('backup'); if (!(file instanceof File) || file.size > 3 * 1024 * 1024) throw new Error(L('Choose a JSON backup no larger than 3 MB.', 'เลือกสำรอง JSON ขนาดไม่เกิน 3 MB'));
      let backup; try { backup = JSON.parse(await file.text()); } catch (_) { throw new Error(L('The backup is not valid JSON.', 'สำรองข้อมูลไม่ใช่ JSON ที่ถูกต้อง')); }
      const result = await request('restoreCampaign', { backup, reason: String(values.get('reason')) }, active().campaign.version);
      const retained = Object.values(result.retainedCounts || {}).reduce((total, count) => total + count, 0);
      ui.showToast(L('Backup recovered. Newer records retained: ', 'กู้คืนสำรองข้อมูลแล้ว คงรายการที่สร้างใหม่กว่า: ') + retained + (result.pendingMemberships ? L('. Members awaiting a fresh invitation: ', ' สมาชิกที่ต้องรับคำเชิญใหม่: ') + result.pendingMemberships : ''));
    }, true);
  }

  window.ArkhamFeatures = { supports: view => views.includes(view), render, tabs, open, launchers };
  document.querySelectorAll('[data-feature-view]').forEach(item => item.addEventListener('click', () => open(item.dataset.featureView)));
  ui.applyLanguage();
})();
</script>
